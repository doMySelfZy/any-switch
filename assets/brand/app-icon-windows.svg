<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="AnySwitch">
  <defs><clipPath id="plate"><rect x="64" y="64" width="896" height="896" rx="43"/></clipPath></defs>
  <g clip-path="url(#plate)">
    <g transform="translate(64 64) scale(0.875)">
      <!-- Full-bleed artwork: platform plates (macOS squircle / Windows rounded rect) supply the outer shape. -->
  <rect x="0" y="0" width="1024" height="1024" fill="#1F70F9"/>
  <!-- Top toggle: white pill, knob engaged to the right -->
  <rect x="252" y="275" width="400" height="180" rx="90" fill="#FFFFFF"/>
  <circle cx="566" cy="365" r="70" fill="#1F70F9"/>
  <!-- Bottom toggle: translucent pill, knob at rest on the left -->
  <rect x="372" y="525" width="400" height="180" rx="90" fill="#FFFFFF" fill-opacity="0.62"/>
  <circle cx="462" cy="615" r="68" fill="#FFFFFF"/>
  <!-- Circular arrows: right arm sweeps down, left arm sweeps up (one clockwise cycle) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round">
    <path d="M 545.1 141.3 A 380 350 0 0 1 730 776.7"/>
    <path d="M 478.9 838.7 A 380 350 0 0 1 294 203.3"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M 686.3 804.9 L 712.6 749.8 L 747.3 803.6 Z"/>
    <path d="M 337.7 175.1 L 311.4 230.2 L 276.7 176.4 Z"/>
  </g>
    </g>
  </g>
</svg>
