name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  # GITHUB_TOKEN cannot fire `on: release` for other workflows. Listen to
  # Release completing so the download page rebuilds only after assets exist.
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to bake into the download page (e.g. v0.0.5)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.event.inputs.release_tag }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: echo "Download page RELEASE_TAG=${RELEASE_TAG:-/releases/latest}"
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Pages custom domain
        run: |
          test -f dist/CNAME
          domain="$(tr -d '[:space:]' < dist/CNAME)"
          # A placeholder domain would claim a reserved hostname for GitHub Pages
          # (breaking both github.io and the custom domain), so fail loudly here
          # instead of deploying a site that looks green in CI.
          case "$domain" in
            ""|*.example.com|example.com|*.example|*.test|*.invalid)
              echo "::error::website/public/CNAME is still a placeholder ('$domain'). Replace it with the real AnySwitch domain (see website/README.md) before deploying GitHub Pages."
              exit 1
              ;;
          esac
          echo "Pages custom domain: $domain"
          test -f dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
